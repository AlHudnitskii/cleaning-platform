[project]
name = "cleaning-platform"
version = "2.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations/versions", "venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = ["SIM112", "S101", "RUF001", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107"]
"src/api/schemas/user.py" = ["S105"]
"seed.py" = ["S311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
untyped_calls_exclude = ["azure.functions"]
exclude = ["migrations/versions", "venv", ".venv"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a running stack (set INTEGRATION_BASE_URL)"]
